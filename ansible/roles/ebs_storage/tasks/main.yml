
---
- name: Check whether the SFTP disk exists
  ansible.builtin.stat:
    path: "{{ sftp_ebs_device }}"
  register: sftp_disk

- name: Verify SFTP disk is a block device
  ansible.builtin.assert:
    that:
      - sftp_disk.stat.exists
      - sftp_disk.stat.isblk
    fail_msg: "SFTP disk {{ sftp_ebs_device }} was not found."

- name: Read existing filesystem type
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ sftp_ebs_device }}"
  register: sftp_disk_filesystem
  changed_when: false
  failed_when: false

- name: Refuse formatting without explicit approval
  ansible.builtin.assert:
    that:
      - (sftp_disk_filesystem.stdout | trim | length > 0) or (sftp_format_data_disk | bool)
    fail_msg: >-
      No filesystem detected. Verify the AWS EBS volume ID and confirm
      that this disk is empty before enabling formatting.

- name: Create ext4 filesystem on approved empty disk
  community.general.filesystem:
    fstype: "{{ sftp_ebs_filesystem }}"
    dev: "{{ sftp_ebs_device }}"
  when:
    - sftp_format_data_disk | bool
    - sftp_disk_filesystem.stdout | trim | length == 0

- name: Verify existing filesystem type
  ansible.builtin.assert:
    that:
      - sftp_disk_filesystem.stdout | trim == sftp_ebs_filesystem
    fail_msg: >-
      The existing filesystem is not {{ sftp_ebs_filesystem }}.
      Stop and investigate before mounting.

  when: sftp_disk_filesystem.stdout | trim | length > 0

- name: Create SFTP mount directory
  ansible.builtin.file:
    path: "{{ sftp_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Get filesystem UUID
  ansible.builtin.command:
    cmd: "blkid -s UUID -o value {{ sftp_ebs_device }}"
  register: sftp_disk_uuid
  changed_when: false

- name: Verify filesystem UUID
  ansible.builtin.assert:
    that:
      - sftp_disk_uuid.stdout | trim | length > 0
    fail_msg: "Filesystem UUID not found."

- name: Mount SFTP EBS disk permanently
  ansible.posix.mount:
    path: "{{ sftp_root }}"
    src: "UUID={{ sftp_disk_uuid.stdout | trim }}"
    fstype: "{{ sftp_ebs_filesystem }}"
    opts: defaults,nofail
    state: mounted
