
---
- name: Verify the approved EBS device exists
  ansible.builtin.stat:
    path: "{{ sftp_ebs_device }}"
    follow: true
  register: sftp_disk

- name: Confirm the EBS device is a block device
  ansible.builtin.assert:
    that:
      - sftp_disk.stat.exists
      - sftp_disk.stat.isblk
    fail_msg: "The approved EBS block device was not found."

- name: Read existing filesystem type
  ansible.builtin.command:
    cmd: "blkid -o value -s TYPE {{ sftp_ebs_device }}"
  register: sftp_disk_filesystem
  changed_when: false
  failed_when: false

- name: Refuse unexpected existing filesystem
  ansible.builtin.assert:
    that:
      - >-
        (sftp_disk_filesystem.stdout | trim == '') or
        (sftp_disk_filesystem.stdout | trim == sftp_ebs_filesystem)
    fail_msg: >-
      Unexpected filesystem detected.
      Expected an empty disk or ext4. No formatting performed.

- name: Require explicit formatting approval for an empty disk
  ansible.builtin.assert:
    that:
      - sftp_format_data_disk | bool
    fail_msg: "Formatting is not approved for this empty disk."

  when: sftp_disk_filesystem.stdout | trim == ''

- name: Create ext4 filesystem on the approved empty EBS volume
  community.general.filesystem:
    fstype: "{{ sftp_ebs_filesystem }}"
    dev: "{{ sftp_ebs_device }}"
  when: sftp_disk_filesystem.stdout | trim == ''

- name: Create SFTP mount directory
  ansible.builtin.file:
    path: "{{ sftp_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Obtain EBS filesystem UUID
  ansible.builtin.command:
    cmd: "blkid -s UUID -o value {{ sftp_ebs_device }}"
  register: sftp_disk_uuid
  changed_when: false

- name: Verify filesystem UUID
  ansible.builtin.assert:
    that:
      - sftp_disk_uuid.stdout | trim | length > 0
    fail_msg: "Unable to obtain the EBS filesystem UUID."

- name: Mount EBS volume permanently
  ansible.posix.mount:
    path: "{{ sftp_root }}"
    src: "UUID={{ sftp_disk_uuid.stdout | trim }}"
    fstype: "{{ sftp_ebs_filesystem }}"
    opts: defaults,nofail
    state: mounted
